<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefef">
  <title>單音節打字｜練台羅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c8273'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3E%C3%A1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    (function () {
      var theme = 'system';
      try {
        var saved = JSON.parse(localStorage.getItem('lian-tailo:settings')) || {};
        if (saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'system') theme = saved.theme;
      } catch (e) {}
      var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#171c1a' : '#efefef');
    })();
    if ('serviceWorker' in navigator) {
      var css = document.querySelector('link[rel="stylesheet"][href*="style.css"]');
      var root = css ? css.getAttribute('href').replace(/css\/style\.css(?:\?.*)?$/, '') : './';
      navigator.serviceWorker.register(root + 'sw.js');
    }
  </script>

</head>
<body class="page-fit">
  <script src="../data/tone-syllables.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/tones.js"></script>
  <script src="../js/quiz-shell.js"></script>
  <script src="../js/mode-typing.js"></script>
  <script>
    QuizShell.create(
      {
        unit: 'type-1',
        title: LianTailo.t('page.type.1'),
        data: window.TONE_SYLLABLES,
        groupBy: (d) => d.p[0][2],
        poolPerGroup: LianTailo.POOL_PER_GROUP.tone,
      },
      TypingMode.create()
    );
  </script>
</body>
</html>
